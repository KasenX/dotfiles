git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --syntax-theme "Visual Studio Dark+" -s
  overrideGpg: true
os:
  edit: '[ -z "$NVIM" ] && nvim {{filename}} || nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:edit {{filename}}<CR>"'
  editAtLine: '[ -z "$NVIM" ] && nvim +{{line}} {{filename}} || nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:edit +{{line}} {{filename}}<CR>"'
  openDirInEditor: '[ -z "$NVIM" ] && nvim {{dir}} || nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:edit {{dir}}<CR>"'
